<div class="page">

  <div class="container">

    <div class="top">

      <a
        routerLink="/tickets"
        class="back">

        →
        بازگشت به درخواست‌ها

      </a>

    </div>


    <div class="form-card">

      <div class="form-header">

        <div class="header-icon">
          +
        </div>

        <div>

          <h1>
            ثبت درخواست جدید
          </h1>

          <p>
            اطلاعات درخواست پشتیبانی را وارد کنید.
          </p>

        </div>

      </div>


      <form
        [formGroup]="form"
        (ngSubmit)="submit()">


        <div class="form-group">

          <label>
            عنوان درخواست
            <span>*</span>
          </label>

          <input
            type="text"
            formControlName="title"
            placeholder="مثلاً مشکل ورود به حساب کاربری"
          />

          <div
            class="error"
            *ngIf="
              form.controls.title.touched &&
              form.controls.title.invalid
            ">

            عنوان درخواست الزامی است.

          </div>

        </div>


        <div class="row">

          <div class="form-group">

            <label>
              نام درخواست‌کننده
              <span>*</span>
            </label>

            <input
              type="text"
              formControlName="requesterName"
              placeholder="نام و نام خانوادگی"
            />

            <div
              class="error"
              *ngIf="
                form.controls.requesterName.touched &&
                form.controls.requesterName.invalid
              ">

              نام درخواست‌کننده الزامی است.

            </div>

          </div>


          <div class="form-group">

            <label>
              اولویت
              <span>*</span>
            </label>

            <select formControlName="priority">

              <option [ngValue]="priorities[0]">
                کم
              </option>

              <option [ngValue]="priorities[1]">
                متوسط
              </option>

              <option [ngValue]="priorities[2]">
                زیاد
              </option>

            </select>

          </div>

        </div>


        <div class="form-group">

          <label>
            توضیحات
            <span>*</span>
          </label>

          <textarea
            rows="7"
            formControlName="description"
            placeholder="لطفاً مشکل یا درخواست خود را با جزئیات توضیح دهید...">
          </textarea>

          <div
            class="description-footer">

            <span
              class="error"
              *ngIf="
                form.controls.description.touched &&
                form.controls.description.invalid
              ">

              توضیحات درخواست الزامی است.

            </span>

            <span class="counter">

              {{ form.controls.description.value.length }}
              / 2000

            </span>

          </div>

        </div>


        <div
          class="api-error"
          *ngIf="errorMessage">

          {{ errorMessage }}

        </div>


        <div class="actions">

          <button
            type="submit"
            class="submit"
            [disabled]="submitting">

            <span *ngIf="!submitting">
              ثبت درخواست
            </span>

            <span *ngIf="submitting">
              در حال ثبت...
            </span>

          </button>


          <a
            routerLink="/tickets"
            class="cancel">

            انصراف

          </a>

        </div>

      </form>

    </div>

  </div>

</div>
